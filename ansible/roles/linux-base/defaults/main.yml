---
# Defaults for role: linux-base
enable_forward_proxy_client: true
manage_sysctl: true
manage_ntp: true

linux_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - python3
  - python3-pip
  - chrony
  - jq
  - unzip
  - tar
  - htop
  - net-tools
  - ufw
