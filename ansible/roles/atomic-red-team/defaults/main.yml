---
# ==============================================================================
# SOCForge — Atomic Red Team Role Default Variables (Phase 10)
# ==============================================================================

# Bastion Forward Proxy Settings (Private Subnet Package Routing)
http_proxy: "{{ http_proxy_url | default('http://10.10.1.131:3128') }}"
https_proxy: "{{ https_proxy_url | default('http://10.10.1.131:3128') }}"
no_proxy: "localhost,127.0.0.1,10.10.0.0/16,169.254.169.254,local.socforge"

# PowerShell Core Version & Repository Configuration
powershell_repo_url: "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb"
powershell_package_name: "powershell"

# Official Atomic Red Team Source Repositories & Pinned Releases
atomic_red_team_repo: "https://github.com/redcanaryco/atomic-red-team.git"
atomic_red_team_version: "master"
atomic_red_team_path: "/opt/atomic-red-team"

invoke_atomic_repo: "https://github.com/redcanaryco/invoke-atomicredteam.git"
invoke_atomic_version: "master"
invoke_atomic_path: "/opt/invoke-atomicredteam"

powershell_modules_path: "/usr/local/share/powershell/Modules"

# Safety Boundary & Target Controls
atomic_execute: false # Default: Simulation execution is DISABLED
atomic_target_name: "SOCForge-windows"
atomic_target_host: "{{ hostvars['windows']['ansible_host'] | default('10.10.10.212') }}"
atomic_target_allowed_hosts:
  - "{{ hostvars['windows']['ansible_host'] | default('10.10.10.212') }}"
  - "10.10.10.212"
  - "10.10.10.254"
  - "10.10.10.200"
  - "127.0.0.1"
  - "localhost"
  - "windows"
  - "SOCForge-windows"

# Simulation Logging & Audit
atomic_log_dir: "/var/log/socforge/atomic"
atomic_log_file: "/var/log/socforge/atomic/simulation.log"
atomic_catalog_path: "/opt/atomic-red-team/socforge-tests.yml"

# Execution Wrapper Script Path
atomic_wrapper_bin: "/usr/local/bin/run-atomic-test"
