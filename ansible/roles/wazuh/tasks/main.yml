---
# ==============================================================================
# SOCForge — Main Tasks for role: wazuh
# ==============================================================================
# Deploys the complete single-node Wazuh SIEM stack in sequence:
# Prerequisites -> Repository -> Certificates -> Indexer -> Manager ->
# Dashboard -> Telemetry Templates & ISM -> Saved Dashboards -> Detection Rules -> Validation
# ==============================================================================

- name: 1. Validate host prerequisites and system sizing
  ansible.builtin.include_tasks: prerequisites.yml

- name: 2. Configure official Wazuh package repositories
  ansible.builtin.include_tasks: repository.yml

- name: 3. Generate and deploy Wazuh TLS/SSL certificates
  ansible.builtin.include_tasks: certificates.yml

- name: 4. Deploy and initialize Wazuh Indexer
  ansible.builtin.include_tasks: indexer.yml

- name: 5. Deploy and configure Wazuh Manager & Filebeat
  ansible.builtin.include_tasks: manager.yml

- name: 6. Deploy and configure Wazuh Dashboard
  ansible.builtin.include_tasks: dashboard.yml

- name: 7. Deploy SOCForge telemetry index templates and ISM retention policies
  ansible.builtin.include_tasks: telemetry.yml

- name: 8. Deploy SOCForge investigation dashboards and index patterns
  ansible.builtin.include_tasks: dashboards.yml

- name: 9. Deploy SOCForge custom decoders and detection rules
  ansible.builtin.include_tasks: detection-rules.yml

- name: 10. Validate Wazuh services, APIs, and health endpoints
  ansible.builtin.include_tasks: validation.yml
