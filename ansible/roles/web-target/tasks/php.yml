---
# ==============================================================================
# Tasks: PHP-FPM Runtime Configuration for DVWA
# ==============================================================================

- name: Discover installed PHP version
  ansible.builtin.shell: |
    php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;'
  register: php_ver_output
  changed_when: false

- name: Set discovered PHP version fact
  ansible.builtin.set_fact:
    detected_php_version: "{{ php_ver_output.stdout | trim }}"
    php_fpm_service_name: "php{{ php_ver_output.stdout | trim }}-fpm"
    php_fpm_sock_path: "/run/php/php{{ php_ver_output.stdout | trim }}-fpm.sock"

- name: Configure PHP settings for DVWA in php.ini
  ansible.builtin.lineinfile:
    path: "/etc/php/{{ detected_php_version }}/fpm/php.ini"
    regexp: "^;?{{ item.key }} ="
    line: "{{ item.key }} = {{ item.val }}"
    state: present
  loop:
    - { key: "allow_url_fopen", val: "On" }
    - { key: "allow_url_include", val: "On" }
    - { key: "display_errors", val: "Off" }
  notify: Restart php-fpm

- name: Ensure PHP-FPM service is started and enabled
  ansible.builtin.service:
    name: "{{ php_fpm_service_name }}"
    state: started
    enabled: true
