---
# ==============================================================================
# Tasks: Auditd Telemetry & Rules Configuration
# ==============================================================================

- name: Ensure audit rules directory exists
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Deploy SOCForge focused audit rules
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/99-socforge-web.rules
    mode: "0640"
    owner: root
    group: root
  notify: Reload auditd

- name: Ensure auditd service is running and enabled
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Load newly generated audit rules
  ansible.builtin.command: augenrules --load
  changed_when: false
