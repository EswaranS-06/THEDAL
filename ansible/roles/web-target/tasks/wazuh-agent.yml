---
# ==============================================================================
# Tasks: Wazuh Agent Deployment & Registration for Linux Web Target
# ==============================================================================

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Download and de-armor Wazuh GPG repository key
  ansible.builtin.shell: |
    curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --no-default-keyring --keyring /etc/apt/keyrings/wazuh.gpg --import - || true
    chmod 0644 /etc/apt/keyrings/wazuh.gpg
  args:
    creates: /etc/apt/keyrings/wazuh.gpg
  environment:
    http_proxy: "{{ http_proxy_url }}"
    https_proxy: "{{ https_proxy_url }}"

- name: Add official Wazuh APT repository source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/wazuh.list
    content: "deb [signed-by=/etc/apt/keyrings/wazuh.gpg] https://packages.wazuh.com/{{ wazuh_major_version }}/apt/ stable main\n"
    mode: "0644"
    owner: root
    group: root

- name: Update APT cache for Wazuh repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Wazuh Agent package
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_version }}-*"
    state: present
  register: wazuh_agent_install
  until: wazuh_agent_install is success
  retries: 3
  delay: 5

- name: Deploy Wazuh Agent configuration for web target (ossec.conf)
  ansible.builtin.template:
    src: ossec-web.conf.j2
    dest: /var/ossec/etc/ossec.conf
    mode: "0640"
    owner: root
    group: ossec
  notify: Restart wazuh-agent

- name: Check if Wazuh Agent client keys exist
  ansible.builtin.stat:
    path: /var/ossec/etc/client.keys
  register: linux_client_keys_stat

- name: Register Wazuh Agent with Wazuh Manager
  ansible.builtin.command: >
    /var/ossec/bin/agent-auth
    -m {{ wazuh_manager_address }}
    -p {{ wazuh_registration_port }}
    -A {{ wazuh_agent_name }}
    -G {{ wazuh_agent_group }}
  when: not linux_client_keys_stat.stat.exists or linux_client_keys_stat.stat.size == 0
  changed_when: true
  notify: Restart wazuh-agent

- name: Ensure Wazuh Agent service is enabled and started
  ansible.builtin.service:
    name: wazuh-agent
    state: started
    enabled: true
