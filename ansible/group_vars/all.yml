---
# ==============================================================================
# SOCForge — Global Ansible Variables
# ==============================================================================

# Project & Network Environment
project_name: SOCForge
environment_tier: lab
vpc_cidr: "10.10.0.0/16"

# Wazuh Platform Version Specification
wazuh_version: "4.14.7"
wazuh_major_version: "4.x"

# Bastion Forward Proxy Configuration
# Internal hosts route HTTP/HTTPS package downloads through Bastion on port 3128
bastion_internal_ip: "10.10.1.10"
proxy_port: 3128
http_proxy_url: "http://{{ hostvars['bastion']['ansible_default_ipv4']['address'] | default(hostvars['bastion']['ansible_host'] | default(bastion_internal_ip)) }}:{{ proxy_port }}"
https_proxy_url: "{{ http_proxy_url }}"
no_proxy_list: "localhost,127.0.0.1,10.10.0.0/16,169.254.169.254,local.socforge"

# NTP / Time Synchronization
ntp_servers:
  - "169.254.169.123" # Amazon Time Sync Service
  - "time.aws.com"
  - "pool.ntp.org"
