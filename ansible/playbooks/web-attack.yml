---
# ==============================================================================
# SOCForge — Web Security Testing Suite Deployment Playbook (Phase 11)
# ==============================================================================
# Deploys web testing tools, curated scenario catalogs for DVWA and Juice Shop,
# safety allowlists, and execution wrappers on SOCForge-attack.
#
# NOTE: This playbook ONLY provisions the web testing suite.
# Web attacks are NOT executed automatically during provisioning.
# ==============================================================================

- name: Deploy Controlled Web Security Testing Suite on SOCForge-attack
  hosts: attack
  become: yes
  gather_facts: yes
  vars:
    # Strict safety interlock: Automated attack execution is disabled during provisioning
    web_attack_execute: false

  pre_tasks:
    - name: Safety check — Ensure automated web attack execution is disabled
      ansible.builtin.assert:
        that:
          - not web_attack_execute
        fail_msg: "CRITICAL: web_attack_execute must be false during provisioning playbook execution."
        success_msg: "Safety check passed: Web attack execution is disabled for provisioning."

  roles:
    - web-attack
